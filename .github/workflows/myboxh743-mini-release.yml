name: Publish Mini firmware (INAV 9 or 10)
run-name: INAV 10 Mini, Mini v2 and Mini v2 Vib (r${{ inputs.revision }}-dev)

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Positive MYBOXES release revision. These images are bench prereleases."
        required: true
        default: "18"
        type: string

permissions:
  contents: read

concurrency:
  group: myboxes-inav-10-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Check selected release branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Reject a release from the wrong branch
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: python3 tools/release_line.py --ref "$SOURCE_BRANCH"

  build:
    needs: preflight
    uses: ./.github/workflows/validate-firmware.yml
    with:
      revision: ${{ inputs.revision }}

  release:
    name: Publish the three verified prereleases
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: myboxes-inav-10-firmware
          path: dist

      - name: Validate the release assets and reserve the version
        run: |
          for directory in dist/mini dist/mini-v2 dist/mini-v2-vib; do
            (cd "$directory" && sha256sum --check SHA256SUMS.txt)
            tag=$(jq -er .release "$directory/manifest.json")
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $tag already exists. Increase the revision." >&2
              exit 1
            fi
          done

      - name: Publish to GitHub Releases
        run: |
          for directory in dist/mini dist/mini-v2 dist/mini-v2-vib; do
            manifest="$directory/manifest.json"
            tag=$(jq -er .release "$manifest")
            title=$(jq -er '.board_name + " INAV " + .version + " r" + (.revision | tostring) + "-dev"' "$manifest")
            firmware=$(jq -er '.files[0].name' "$manifest")
            test "$(jq -er .source_branch "$manifest")" = "inav-10"
            test "$(jq -er .inav_major "$manifest")" = "10"
            notes="Стендовая сборка MYBOX H743 Mini. PWM, USB DFU, локальный HEX в INAV Configurator 10.0 и SBUS на RCIN через mybox_sbus_rcin."
            notes="$notes Для MS4525 выберите pitot_hardware = MS4525. Опрос начинается с I²C2, затем проверяются остальные доступные I²C."
            notes="$notes Blackbox открывает FAT16/FAT32 в MBR и без MBR. Старт SD пробует 4/1 бит; при runtime-ошибке запись останавливается до перезапуска, не задерживая управление повторной инициализацией."
            notes="$notes DShot доступен в настройках моторов. При двух ESC на PWM1–2 разъёмы PWM3 и дальше доступны для PWM-серв."
            notes="$notes Ветка inav-10, основа INAV 10.0.0-rc2; определения плат перенесены из r15. Заводской профиль Matek M10Q-3100: CAN1, 1000 кбит/с, DNA ON, GPS и компас DroneCAN. Выбор CAN1/CAN2: dronecan_bus = 1 или 2, затем save. Один интерфейс активен одновременно."
            notes="$notes Перед переходом с 9.x сохраните конфигурацию через Backup Config в Configurator 10, прошейте с Full Chip Erase. Restore Config заменит заводской профиль сохранёнными настройками."
            notes="$notes r17 ограничивает ожидания SPI/OSD/SD/I2C, проверяет данные CAN-GPS и восстанавливает CAN после bus-off. PID, микшер, приёмник и логика выбора датчиков сохранены как в r16; новых disarm или watchdog-перезапусков нет."
            if [[ "$directory" == dist/mini-v2-vib ]]; then
              notes="$notes Оба IMU и оба SPA06-003 доступны для проверки. Приоритет у выносных IMU и барометра. Ориентация выносного ICM-42670-P временная."
            fi
            gh release create "$tag" "$directory/$firmware" "$manifest" "$directory/SHA256SUMS.txt" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --prerelease --notes "$notes"
          done
